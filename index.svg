<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1366 768" preserveAspectRatio="none">
  <foreignObject width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Synnical OS</title>
        <style><![CDATA[
          html,
          body,
          #root {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
          }
          iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
          }
          #blocked {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            background: #000;
            color: #fff;
            font: 14px system-ui, sans-serif;
          }
          #blocked a {
            color: #fff;
          }
        ]]></style>
      </head>
      <body>
        <div id="root">
          <iframe
            id="synnical-os-frame"
            title="Synnical OS"
            src="https://synnical.co.uk/?synnicalClient=svg"
            referrerpolicy="no-referrer-when-downgrade"
            allow="fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; microphone; camera; display-capture"
            sandbox="allow-downloads allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts">
          </iframe>
          <div id="blocked">
            <a href="https://synnical.co.uk/?synnicalClient=svg" target="_blank" rel="noopener noreferrer">Open Synnical OS</a>
          </div>
        </div>
        <script><![CDATA[
          (function () {
            var frame = document.getElementById("synnical-os-frame");
            var blocked = document.getElementById("blocked");
            var loaded = false;
            frame.addEventListener("load", function () {
              loaded = true;
              blocked.style.display = "none";
            });
            setTimeout(function () {
              if (!loaded) blocked.style.display = "grid";
            }, 2500);
          })();
        ]]></script>
      </body>
    </html>
  </foreignObject>
</svg>
