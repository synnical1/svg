<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%"
     height="100%"
     style="display:block;width:100vw;height:100vh;overflow:hidden;background:#090d16">
  <title>Synnical</title>
  <desc>Synnical OS</desc>
  <xhtml:link rel="icon" type="image/png" href="./favicon.svg" />
  <xhtml:link rel="shortcut icon" type="image/png" href="./favicon.svg" />

  <!--
    IMPORTANT: do not give this document a fixed pixel size or viewBox.
    Chrome treats a directly-opened SVG as an image document. A 1366x768
    intrinsic canvas gets fitted to the browser content area and the entire
    foreignObject/iframe is then resampled, which is exactly what made text,
    icons and borders look soft compared with synnical.co.uk.

    Percentage sizing keeps the SVG viewport, foreignObject and iframe on the
    browser's native CSS-pixel grid at every window/fullscreen size.
  -->
  <foreignObject id="synnical-viewport" x="0" y="0" width="100%" height="100%">
    <xhtml:html lang="en">
      <xhtml:head>
        <xhtml:meta charset="UTF-8" />
        <xhtml:meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
        <xhtml:title>Synnical</xhtml:title>
        <xhtml:link rel="icon" type="image/png" href="./favicon.svg" />
        <xhtml:link rel="shortcut icon" type="image/png" href="./favicon.svg" />
        <xhtml:style><![CDATA[
          * {
            box-sizing: border-box;
          }

          html,
          body,
          #synnical-root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #090d16;
          }

          html,
          body {
            position: absolute;
            inset: 0;
          }

          #synnical-root {
            position: absolute;
            inset: 0;
          }

          #synnical-os-frame {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            background: #090d16;
            transform: none;
            filter: none;
          }

          #blocked {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            padding: 24px;
            background: #090d16;
            color: #f4f7fb;
            font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
          }

          #blocked a {
            color: #f4f7fb;
          }
        ]]></xhtml:style>
      </xhtml:head>

      <xhtml:body>
        <xhtml:div id="synnical-root">
          <xhtml:iframe
            id="synnical-os-frame"
            title="Synnical"
            src="https://synnical.co.uk/?synnicalClient=svg"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; microphone; camera; display-capture; storage-access-by-user-activation"
            sandbox="allow-downloads allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts">
          </xhtml:iframe>

          <xhtml:div id="blocked">
            <xhtml:div>
              <xhtml:p>Synnical could not be embedded in this tab.</xhtml:p>
              <xhtml:a href="https://synnical.co.uk/?synnicalClient=svg" target="_blank" rel="noopener noreferrer">Open Synnical</xhtml:a>
            </xhtml:div>
          </xhtml:div>
        </xhtml:div>

        <xhtml:script><![CDATA[
          (function () {
            var frame = document.getElementById("synnical-os-frame");
            var blocked = document.getElementById("blocked");
            var loaded = false;

            function applyDocumentIdentity() {
              try {
                document.title = "Synnical";
              } catch (_) {}

              try {
                var svgTitle = document.documentElement.querySelector(":scope > title");
                if (svgTitle) svgTitle.textContent = "Synnical";
              } catch (_) {}
            }

            applyDocumentIdentity();
            window.addEventListener("pageshow", applyDocumentIdentity);
            window.addEventListener("focus", applyDocumentIdentity);

            frame.addEventListener("load", function () {
              loaded = true;
              blocked.style.display = "none";
              applyDocumentIdentity();
            });

            setTimeout(function () {
              if (!loaded) blocked.style.display = "grid";
            }, 6000);
          })();
        ]]></xhtml:script>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>
